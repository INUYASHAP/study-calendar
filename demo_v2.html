<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七宝的暑假冒险日历 - V2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --mc-dirt: #8B5A2B;
    --mc-dirt-dark: #6B4423;
    --mc-grass: #5D9C3C;
    --mc-grass-dark: #3D7C2C;
    --mc-stone: #8B8B8B;
    --mc-stone-dark: #6B6B6B;
    --mc-obsidian: #1B1029;
    --mc-obsidian-purple: #3D1F5C;
    --mc-diamond: #4AEDD9;
    --mc-gold: #FFAA00;
    --mc-iron: #D8AF93;
    --mc-redstone: #B00000;
    --mc-lapis: #3030C8;
    --mc-emerald: #00AA00;
    --bg-primary: #1C1C2E;
    --bg-header: #2A2240;
    --bg-card: #252538;
    --bg-card-light: #2E2E45;
    --accent-purple: #7B3FA0;
    --accent-cyan: #00D4AA;
    --accent-gold: #FFAA00;
    --accent-green: #5D9C3C;
    --accent-red: #B00000;
    --text-primary: #FFFFFF;
    --text-secondary: #B0B0C0;
    --text-dim: #707080;
    --font-pixel: 'Press Start 2P', monospace;
    --font-mc: 'VT323', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-mc);
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    font-size: 16px;
  }
  .particles-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .particle {
    position: absolute;
    background: var(--mc-grass);
    opacity: 0.4;
    animation: float 18s infinite linear;
    image-rendering: pixelated;
  }
  @keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-10vh); opacity: 0; }
  }

  .app-container {
    position: relative; z-index: 1;
    max-width: 480px; margin: 0 auto;
    min-height: 100vh;
  }

  /* ============ 角色状态栏 ============ */
  .hero-status-bar {
    background: var(--bg-header);
    border-bottom: 3px solid var(--mc-obsidian-purple);
    padding: 14px 14px 18px;
    position: relative;
  }
  .hero-status-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: repeating-linear-gradient(
      90deg,
      var(--mc-grass) 0 6px,
      var(--mc-dirt) 6px 12px,
      var(--mc-grass) 12px 18px,
      var(--mc-dirt) 18px 24px
    );
  }
  .hero-status-inner {
    display: flex;
    align-items: stretch;
    gap: 12px;
  }
  .hero-character {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 85px;
    flex-shrink: 0;
  }
  .hero-svg-wrapper {
    width: 75px;
    height: 95px;
    background: var(--mc-stone-dark);
    border: 2px solid var(--mc-stone);
    border-bottom: none;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
    position: relative;
    image-rendering: pixelated;
  }
  .hero-svg-wrapper::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 0; right: 0;
    height: 6px;
    background: var(--mc-grass);
    box-shadow: 0 2px 0 var(--mc-grass-dark);
  }
  .hero-svg-wrapper svg {
    width: 55px;
    height: 75px;
    image-rendering: pixelated;
    animation: heroIdle 2.5s ease-in-out infinite;
  }
  @keyframes heroIdle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .level-badge {
    background: var(--mc-gold);
    color: #000;
    font-family: var(--font-pixel);
    font-size: 9px;
    padding: 3px 8px;
    margin-bottom: 6px;
    border: 2px solid #B37400;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.3);
  }
  .equipment-display {
    display: flex;
    gap: 3px;
  }
  .equip-slot {
    width: 18px;
    height: 18px;
    background: #3A3A3A;
    border: 2px solid #5A5A5A;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .equip-slot.has-item {
    background: #4A4A2A;
    border-color: var(--mc-gold);
    box-shadow: inset 0 0 4px rgba(255,170,0,0.3);
  }
  .equip-slot.has-item::after {
    content: '';
    position: absolute;
    top: -3px; right: -3px;
    width: 6px; height: 6px;
    background: var(--mc-emerald);
    border: 1px solid #006600;
  }
  .equip-slot svg {
    width: 12px;
    height: 12px;
    image-rendering: pixelated;
  }
  .hero-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .hero-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .hero-name {
    font-size: 22px;
    color: var(--mc-gold);
    text-shadow: 2px 2px 0 #000;
    font-family: var(--font-mc);
    line-height: 1;
  }
  .hero-title-tag {
    background: var(--accent-purple);
    color: white;
    font-size: 11px;
    padding: 2px 8px;
    border: 2px solid #5A2080;
  }
  .exp-section { margin-bottom: 10px; }
  .exp-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    font-family: var(--font-mc);
  }
  .exp-bar {
    height: 10px;
    background: #3A0000;
    border: 2px solid #5A0000;
    overflow: hidden;
  }
  .exp-fill {
    height: 100%;
    background: var(--accent-green);
    border-right: 2px solid #7BC040;
    transition: width 0.5s;
    position: relative;
  }
  .exp-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: expShine 2s infinite;
  }
  @keyframes expShine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .currency-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .currency-item {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #2A2A3A;
    padding: 3px 8px;
    border: 2px solid #3A3A4A;
  }
  .currency-item svg { width: 14px; height: 14px; image-rendering: pixelated; }
  .currency-value {
    font-size: 14px;
    font-family: var(--font-pixel);
  }
  .currency-value.coins { color: var(--mc-gold); font-size: 11px; }
  .currency-value.gems { color: var(--mc-diamond); font-size: 11px; }
  .streak-badge {
    display: flex;
    align-items: center;
    gap: 3px;
    background: var(--mc-redstone);
    color: white;
    padding: 3px 8px;
    font-family: var(--font-pixel);
    font-size: 9px;
    border: 2px solid #800000;
  }
  .streak-badge svg { width: 12px; height: 12px; }

  /* ============ 内容区 ============ */
  .content-area {
    padding: 16px;
    padding-bottom: 80px;
  }
  .date-selector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .date-btn {
    width: 32px;
    height: 32px;
    background: var(--bg-card);
    border: 2px solid #4A4A5A;
    color: var(--text-primary);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    image-rendering: pixelated;
  }
  .date-btn:hover { background: var(--bg-card-light); }
  .date-display { text-align: center; }
  .date-main {
    font-size: 20px;
    color: var(--mc-gold);
    text-shadow: 2px 2px 0 #000;
  }
  .date-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .time-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
  }
  .time-tab {
    flex: 1;
    padding: 10px 6px;
    background: var(--bg-card);
    border: 2px solid #4A4A5A;
    color: var(--text-secondary);
    font-family: var(--font-mc);
    font-size: 14px;
    cursor: pointer;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .time-tab.active {
    background: var(--accent-purple);
    border-color: #9B5FD0;
    color: white;
    box-shadow: 0 0 0 2px #5A2080;
  }
  .time-tab svg {
    width: 22px;
    height: 22px;
    image-rendering: pixelated;
  }
  .tab-count {
    background: #000;
    color: var(--mc-gold);
    font-family: var(--font-pixel);
    font-size: 8px;
    padding: 1px 4px;
  }

  /* 任务卡片 */
  .task-list { display: flex; flex-direction: column; gap: 12px; }
  .task-card {
    background: var(--bg-card);
    border: 2px solid #4A4A5A;
    padding: 14px;
    position: relative;
    transition: border-color 0.2s;
    animation: cardIn 0.4s ease-out backwards;
  }
  .task-card:nth-child(1) { animation-delay: 0.05s; }
  .task-card:nth-child(2) { animation-delay: 0.1s; }
  .task-card:nth-child(3) { animation-delay: 0.15s; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .task-card:hover {
    border-color: var(--mc-gold);
  }
  .task-card::before {
    content: '';
    position: absolute;
    top: -3px; left: -3px; right: -3px;
    height: 3px;
    background: var(--mc-gold);
  }
  .task-card.completed {
    opacity: 0.6;
    border-color: var(--mc-stone);
  }
  .task-card.completed::after {
    content: '✓';
    position: absolute;
    top: 10px; right: 12px;
    width: 22px; height: 22px;
    background: var(--mc-emerald);
    color: white;
    font-family: var(--font-pixel);
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #006600;
  }
  .task-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .task-icon {
    width: 42px;
    height: 42px;
    background: var(--mc-stone-dark);
    border: 2px solid var(--mc-stone);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .task-icon svg {
    width: 30px;
    height: 30px;
    image-rendering: pixelated;
  }
  .task-info { flex: 1; }
  .task-name {
    font-size: 17px;
    color: var(--mc-gold);
    margin-bottom: 3px;
    text-shadow: 1px 1px 0 #000;
  }
  .task-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.3;
  }
  .task-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .task-rewards { display: flex; gap: 8px; }
  .reward-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-pixel);
    font-size: 9px;
    padding: 4px 6px;
    border: 2px solid;
    background: #1A1A2A;
  }
  .reward-chip svg { width: 12px; height: 12px; image-rendering: pixelated; }
  .reward-chip.exp { color: var(--mc-emerald); border-color: #006600; }
  .reward-chip.coin { color: var(--mc-gold); border-color: #B37400; }
  .start-btn {
    background: var(--mc-emerald);
    border: 2px solid #006600;
    color: white;
    font-family: var(--font-mc);
    font-size: 15px;
    padding: 6px 16px;
    cursor: pointer;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
  }
  .start-btn:hover { background: #00CC00; }
  .start-btn:active { background: #008800; }
  .start-btn:disabled {
    background: var(--mc-stone-dark);
    border-color: #4A4A4A;
    color: var(--text-dim);
    cursor: not-allowed;
  }

  /* 底部导航 */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-header);
    border-top: 3px solid var(--mc-obsidian-purple);
    display: flex;
    justify-content: space-around;
    padding: 6px 0;
    padding-bottom: calc(6px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .bottom-nav::before {
    content: '';
    position: absolute;
    top: -3px; left: 0; right: 0;
    height: 3px;
    background: repeating-linear-gradient(
      90deg,
      var(--mc-diamond) 0 8px,
      var(--mc-lapis) 8px 16px
    );
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: var(--font-mc);
    font-size: 13px;
    cursor: pointer;
    padding: 4px;
  }
  .nav-item.active { color: var(--mc-gold); }
  .nav-item svg {
    width: 26px;
    height: 26px;
    image-rendering: pixelated;
  }

  @media (min-width: 768px) {
    .app-container { max-width: 520px; }
  }
</style>
</head>
<body>

<div class="particles-bg" id="particlesBg"></div>

<div class="app-container">

  <!-- ============ 角色状态栏 ============ -->
  <div class="hero-status-bar">
    <div class="hero-status-inner">
      
      <div class="hero-character">
        <div class="hero-svg-wrapper">
          <!-- MC 史蒂夫 -->
          <svg viewBox="0 0 16 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <!-- 头发 -->
            <rect x="4" y="0" width="8" height="1" fill="#3B2A1A"/>
            <rect x="3" y="1" width="10" height="2" fill="#3B2A1A"/>
            <!-- 脸 -->
            <rect x="4" y="3" width="8" height="4" fill="#F5C6A5"/>
            <rect x="3" y="3" width="1" height="4" fill="#3B2A1A"/>
            <rect x="12" y="3" width="1" height="4" fill="#3B2A1A"/>
            <!-- 眼 -->
            <rect x="6" y="4" width="1" height="1" fill="#5F85CF"/>
            <rect x="9" y="4" width="1" height="1" fill="#5F85CF"/>
            <rect x="6" y="5" width="1" height="1" fill="#FFFFFF"/>
            <rect x="9" y="5" width="1" height="1" fill="#FFFFFF"/>
            <!-- 嘴 -->
            <rect x="7" y="6" width="2" height="1" fill="#8B6B4A"/>
            <!-- 衬衫 -->
            <rect x="4" y="8" width="8" height="8" fill="#3D5AFE"/>
            <rect x="6" y="8" width="4" height="1" fill="#2962FF"/>
            <!-- 袖 -->
            <rect x="3" y="8" width="1" height="7" fill="#3D5AFE"/>
            <rect x="12" y="8" width="1" height="7" fill="#3D5AFE"/>
            <rect x="3" y="15" width="1" height="1" fill="#F5C6A5"/>
            <rect x="12" y="15" width="1" height="1" fill="#F5C6A5"/>
            <!-- 腰带 -->
            <rect x="4" y="16" width="8" height="1" fill="#8B6914"/>
            <!-- 裤 -->
            <rect x="5" y="17" width="3" height="6" fill="#3F51B5"/>
            <rect x="8" y="17" width="3" height="6" fill="#3F51B5"/>
            <!-- 鞋 -->
            <rect x="5" y="23" width="3" height="3" fill="#4A4A4A"/>
            <rect x="8" y="23" width="3" height="3" fill="#4A4A4A"/>
            <rect x="5" y="26" width="3" height="1" fill="#2D2D2D"/>
            <rect x="8" y="26" width="3" height="1" fill="#2D2D2D"/>
          </svg>
        </div>
        <div class="level-badge">LV.1</div>
        <div class="equipment-display">
          <!-- 铁头盔 -->
          <div class="equip-slot has-item">
            <svg viewBox="0 0 8 8"><rect width="8" height="8" fill="#D8AF93"/><rect x="1" y="1" width="6" height="2" fill="#E8BFAB"/><rect x="0" y="3" width="8" height="3" fill="#C89F83"/><rect x="2" y="6" width="4" height="2" fill="#B88F73"/></svg>
          </div>
          <!-- 皮护甲 -->
          <div class="equip-slot has-item">
            <svg viewBox="0 0 8 8"><rect width="8" height="8" fill="#8B4513"/><rect x="1" y="0" width="6" height="1" fill="#A0522D"/><rect x="0" y="1" width="8" height="6" fill="#6B3410"/><rect x="3" y="3" width="2" height="2" fill="#FFD700"/></svg>
          </div>
          <!-- 木剑 -->
          <div class="equip-slot has-item">
            <svg viewBox="0 0 8 8"><rect x="3" y="0" width="2" height="5" fill="#A0522D"/><rect x="2" y="4" width="4" height="1" fill="#8B4513"/><rect x="3" y="5" width="2" height="3" fill="#6B3410"/><rect x="2" y="3" width="1" height="1" fill="#FFD700"/><rect x="5" y="3" width="1" height="1" fill="#FFD700"/></svg>
          </div>
          <!-- 空 -->
          <div class="equip-slot">
            <svg viewBox="0 0 8 8" style="opacity:0.3"><rect x="1" y="0" width="6" height="8" fill="#696969"/><rect x="2" y="1" width="4" height="2" fill="#555555"/><rect x="0" y="3" width="8" height="2" fill="#777777"/><rect x="3" y="5" width="2" height="3" fill="#555555"/></svg>
          </div>
          <div class="equip-slot">
            <svg viewBox="0 0 8 8" style="opacity:0.3"><rect width="8" height="6" fill="#696969"/><rect x="1" y="6" width="3" height="2" fill="#555555"/><rect x="4" y="6" width="3" height="2" fill="#555555"/><rect x="2" y="2" width="4" height="2" fill="#777777"/></svg>
          </div>
        </div>
      </div>

      <div class="hero-info">
        <div class="hero-name-row">
          <span class="hero-name">七宝</span>
          <span class="hero-title-tag">新手冒险家</span>
        </div>
        <div class="exp-section">
          <div class="exp-label">
            <span>经验值</span>
            <span>230 / 1000</span>
          </div>
          <div class="exp-bar">
            <div class="exp-fill" style="width: 23%"></div>
          </div>
        </div>
        <div class="currency-row">
          <div class="currency-item">
            <svg viewBox="0 0 8 8"><rect width="8" height="8" fill="#FFAA00"/><rect x="1" y="1" width="6" height="6" fill="#FFD700"/><rect x="2" y="2" width="4" height="4" fill="#FFFF00"/></svg>
            <span class="currency-value coins">128</span>
          </div>
          <div class="currency-item">
            <svg viewBox="0 0 8 8"><rect x="2" y="0" width="4" height="1" fill="#4AEDD9"/><rect x="1" y="1" width="6" height="1" fill="#3ADDC9"/><rect width="8" height="5" fill="#4AEDD9"/><rect x="1" y="6" width="6" height="1" fill="#3ADDC9"/><rect x="2" y="7" width="4" height="1" fill="#2ACCBB"/><rect x="2" y="2" width="2" height="2" fill="#FFFFFF"/></svg>
            <span class="currency-value gems">3</span>
          </div>
          <div class="streak-badge">
            <svg viewBox="0 0 8 8"><rect x="3" y="0" width="2" height="1" fill="#FF6B00"/><rect x="2" y="1" width="4" height="2" fill="#FF4500"/><rect x="1" y="3" width="6" height="3" fill="#FFA500"/><rect x="2" y="6" width="4" height="2" fill="#FFD700"/><rect x="3" y="2" width="1" height="2" fill="#FFFF00"/><rect x="4" y="3" width="1" height="1" fill="#FFFFFF"/></svg>
            5天
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 内容区 ============ -->
  <div class="content-area">
    
    <div class="date-selector">
      <button class="date-btn">‹</button>
      <div class="date-display">
        <div class="date-main">7月30日</div>
        <div class="date-sub">· 星期四 · 今天</div>
      </div>
      <button class="date-btn">›</button>
    </div>

    <div class="time-tabs">
      <div class="time-tab active">
        <!-- 太阳 -->
        <svg viewBox="0 0 8 8"><rect x="3" y="0" width="2" height="1" fill="#FFD700"/><rect x="3" y="7" width="2" height="1" fill="#FFD700"/><rect x="0" y="3" width="1" height="2" fill="#FFD700"/><rect x="7" y="3" width="1" height="2" fill="#FFD700"/><rect x="1" y="1" width="1" height="1" fill="#FFD700"/><rect x="6" y="1" width="1" height="1" fill="#FFD700"/><rect x="1" y="6" width="1" height="1" fill="#FFD700"/><rect x="6" y="6" width="1" height="1" fill="#FFD700"/><rect x="2" y="2" width="4" height="4" fill="#FFFF00"/></svg>
        上午
        <span class="tab-count">2</span>
      </div>

<script>
  const bg = document.getElementById('particlesBg');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.width = (Math.random() * 4 + 3) + 'px';
    p.style.height = p.style.width;
    p.style.animationDuration = (Math.random() * 12 + 10) + 's';
    p.style.animationDelay = Math.random() * 8 + 's';
    p.style.background = Math.random() > 0.5 ? '#5D9C3C' : '#7B3FA0';
    bg.appendChild(p);
  }

  document.querySelectorAll('.time-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.time-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    });
  });
